# SPDX-License-Identifier: MPL-2.0
name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11', 'nightly']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # AGENTS.adoc "CI & Solver Detection": install at least one solver and
      # keep it on PATH so solver-backed tests run instead of skipping. Ubuntu
      # legs get Z3; other legs keep the documented graceful-skip behaviour
      # (#62). `z3 --version` is the positive execution sentinel.
      - name: Install Z3 (ubuntu)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y z3
          z3 --version
      - name: Setup Julia
        uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.julia-version }}
      - name: Cache Julia artifacts
        uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      # AcceleratorGate is registered in the hyperpolymath registry, not in
      # General. The registry is added to the depot that the test step reuses.
      - name: Install, build, test
        run: julia --project=. -e 'using Pkg; Pkg.Registry.add("General"); Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/hyperpolymath/julia-professional-registry.git")); Pkg.instantiate(); Pkg.build(); Pkg.test(coverage=true)'
