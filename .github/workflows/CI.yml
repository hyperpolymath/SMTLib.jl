# SPDX-License-Identifier: MPL-2.0
name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11', 'nightly']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      # AGENTS.adoc "CI & Solver Detection": install at least one solver and
      # keep it on PATH so solver-backed tests run instead of skipping. Ubuntu
      # legs get Z3; other legs keep the documented graceful-skip behaviour
      # (#62). `z3 --version` is the positive execution sentinel.
      - name: Install Z3 (ubuntu)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y z3
          z3 --version
      - name: Setup Julia
        uses: julia-actions/setup-julia@v3.0.3
        with:
          version: ${{ matrix.julia-version }}
      - name: Cache Julia artifacts
        uses: julia-actions/cache@v3.5.0
      - name: Install, build, test
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.build(); Pkg.test(coverage=true)'
