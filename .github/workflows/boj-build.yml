# SPDX-License-Identifier: MPL-2.0
name: BoJ Server Build Trigger
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  trigger-boj:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trigger BoJ Server (Casket/ssg-mcp)
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Send a secure trigger to boj-server to build this repository.
          # Values pass through env and are JSON-encoded with jq --arg, never
          # interpolated into the shell or the payload by string pasting.
          payload="$(jq -n \
            --arg repo "$REPOSITORY" \
            --arg branch "$REF_NAME" \
            --arg engine "casket" \
            '{repo: $repo, branch: $branch, engine: $engine}')"
          curl -X POST "http://boj-server.local:7700/cartridges/ssg-mcp/invoke" \
            -H "Content-Type: application/json" \
            -d "$payload"
        # by-design: best-effort trigger to the internal boj-server; the
        # service may be absent on a runner and that must not fail CI. This is
        # an advisory step, not a suppressed gate (TOOLING-VERSION-INTEGRITY R4).
        continue-on-error: true
permissions:
  contents: read
